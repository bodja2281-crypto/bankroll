name: Protected build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Install darklua
        run: cargo install darklua --version 0.19.0 --locked

      - name: Build protected distribution
        run: |
          mkdir -p dist
          darklua process bankroll_ftap.lua dist/xxtejo.lua --config .darklua.json
          sha256sum dist/xxtejo.lua > dist/xxtejo.lua.sha256

      - name: Upload protected artifact
        uses: actions/upload-artifact@v4
        with:
          name: xxtejo-protected-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

